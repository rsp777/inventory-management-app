# Test datasource - H2 in-memory, no external DB needed
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Kafka auto-configuration so no broker connection is attempted during tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# JWT secret for test token operations
jwt.secret=testSecret

# External API - unreachable in test, services use mocks
external.api.url=http://localhost:9999
external.api.timeout=1000
external.api.retry-attempts=1

# sop-http2 timeout config properties
connection.timeout=5
response.timeout=5
connection.request.timeout=5

# Hikari minimal pool for tests
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# Eureka disabled
eureka.client.enabled=false
spring.main.allow-bean-definition-overriding=true

# Suppress Thymeleaf template resolution errors in slice tests
spring.thymeleaf.cache=false
