name: Build and Deploy to Tailscale Server

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Select deployment server'
        required: true
        type: choice
        options:
          - local-dev
          - local-qa
          - local-prod
      custom_ip:
        description: 'Or enter custom Tailscale IP (optional, overrides server_name)'
        required: false
        type: string
      custom_user:
        description: 'SSH user for custom IP (default: deploy)'
        required: false
        default: 'deploy'
        type: string
      branch:
        description: 'Git branch/tag to deploy'
        required: false
        type: string

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Create Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            
            <servers>
              <server>
                <id>custom-repo</id>
                <username>${{ secrets.MAVEN_REPO_USERNAME }}</username>
                <password>${{ secrets.MAVEN_REPO_PASSWORD }}</password>
              </server>
            </servers>
            
            <profiles>
              <profile>
                <id>custom-profile</id>
                <repositories>
                  <repository>
                    <id>custom-repo</id>
                    <url>${{ secrets.MAVEN_REPO_URL }}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            
            <activeProfiles>
              <activeProfile>custom-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
      
      - name: Build with Maven
        id: build
        run: |
          mvn clean package -DskipTests
          JAR_FILE=$(ls target/*.jar | head -1)
          JAR_NAME=$(basename "$JAR_FILE")
          echo "artifact=${JAR_NAME}" >> $GITHUB_OUTPUT
          echo "Built artifact: ${JAR_NAME}"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app
          path: target/*.jar
          retention-days: 5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Determine Target Server
        id: server
        run: |
          if [ -n "${{ github.event.inputs.custom_ip }}" ]; then
            TARGET_IP="${{ github.event.inputs.custom_ip }}"
            TARGET_USER="${{ github.event.inputs.custom_user }}"
          else
            case "${{ github.event.inputs.server_name }}" in
              local-dev)
                TARGET_IP="${{ secrets.TAILSCALE_DEV_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_DEV_USER }}"
                ;;
              local-qa)
                TARGET_IP="${{ secrets.TAILSCALE_QA_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_QA_USER }}"
                ;;
              local-prod)
                TARGET_IP="${{ secrets.TAILSCALE_PROD_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_PROD_USER }}"
                ;;
              *)
                # For push events (auto-deploy to prod)
                TARGET_IP="${{ secrets.TAILSCALE_SERVER_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_DEPLOY_USER }}"
                ;;
            esac
          fi
          
          echo "target_ip=${TARGET_IP}" >> $GITHUB_OUTPUT
          echo "target_user=${TARGET_USER}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${TARGET_USER}@${TARGET_IP}"
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-app
      
      - name: Setup SSH for Tailscale
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TAILSCALE_SSH_KEY }}" > ~/.ssh/tailscale_deploy_key
          chmod 600 ~/.ssh/tailscale_deploy_key
          
          # Add Tailscale server to known hosts
          echo "Adding ${{ steps.server.outputs.target_ip }} to known hosts..."
          ssh-keyscan -H ${{ steps.server.outputs.target_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Create SSH config for better connectivity
          cat > ~/.ssh/config << 'SSHCONFIG'
          Host tailscale-server
            HostName ${{ steps.server.outputs.target_ip }}
            User ${{ steps.server.outputs.target_user }}
            IdentityFile ~/.ssh/tailscale_deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 60
            ServerAliveCountMax 3
          SSHCONFIG
          chmod 600 ~/.ssh/config
      
      - name: Test Connectivity to Tailscale Server
        run: |
          echo "Testing SSH connection to ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}"
          ssh -i ~/.ssh/tailscale_deploy_key \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }} \
              "echo 'Connected!' && hostname && uptime"
      
      - name: Deploy to Tailscale Server
        run: |
          JAR_FILE=$(ls *.jar | head -1)
          echo "📦 Deploying ${JAR_FILE} to ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}"
          
          # Copy JAR file to server
          scp -i ~/.ssh/tailscale_deploy_key \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${JAR_FILE}" \
              ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}:/opt/inventory-app/
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to upload JAR file"
            exit 1
          fi
          echo "✅ JAR uploaded successfully"
          
          # Execute deployment script on remote server
          ssh -i ~/.ssh/tailscale_deploy_key \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }} << 'EOF'
            set -e
            
            echo "================================"
            echo "🔄 Starting deployment process..."
            echo "================================"
            
            # Stop existing application with timeout
            echo "⏹️  Stopping existing application..."
            timeout 15 systemctl stop inventory-app || true
            sleep 2
            
            # Verify app is stopped
            if systemctl is-active --quiet inventory-app; then
              echo "❌ Failed to stop application"
              exit 1
            fi
            echo "✅ Application stopped"
            
            # Deploy new version
            echo "📥 Deploying new application"
            cd /opt/inventory-app
            rm -f inventory-app-current.jar
            ln -s "${JAR_FILE}" inventory-app-current.jar
            
            # Verify symlink
            if [ ! -L inventory-app-current.jar ]; then
              echo "❌ Failed to create symlink"
              exit 1
            fi
            echo "✅ Symlink created: $(readlink inventory-app-current.jar)"
            
            # Start application with increased timeout
            echo "🚀 Starting application..."
            systemctl start inventory-app
            sleep 5
            
            # Verify application started and is healthy
            echo "🔍 Checking application health..."
            for i in {1..10}; do
              if systemctl is-active --quiet inventory-app; then
                echo "✅ Application is running (attempt $i/10)"
                break
              fi
              if [ $i -lt 10 ]; then
                echo "⏳ Waiting for application to start (attempt $i/10)..."
                sleep 2
              fi
            done
            
            if ! systemctl is-active --quiet inventory-app; then
              echo "❌ Application failed to start"
              systemctl status inventory-app
              journalctl -u inventory-app -n 20 --no-pager
              exit 1
            fi
            
            echo "================================"
            echo "✅ Deployment successful!"
            echo "================================"
            systemctl status inventory-app --no-pager
            echo ""
            echo "📋 Recent logs:"
            journalctl -u inventory-app -n 10 --no-pager
            EOF
      
      - name: Verify Deployment
        if: success()
        run: |
          echo "✅ Verifying deployment..."
          ssh -i ~/.ssh/tailscale_deploy_key \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }} \
              "systemctl status inventory-app --no-pager && curl -s http://localhost:8086/inventory-ui/health || echo 'App is running'"
      
      - name: Deployment Success Notification
        if: success()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║  ✅ DEPLOYMENT SUCCESSFUL              ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ Server: ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}"
          echo "║ App: inventory-app"
          echo "║ Status: Running"
          echo "╚════════════════════════════════════════╝"
      
      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║  ❌ DEPLOYMENT FAILED                  ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ Server: ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}"
          echo "║ Check workflow logs for details"
          echo "╚════════════════════════════════════════╝"
          exit 1
