<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Create LPN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/inventory-ui/css/operations-ui.css">
</head>
<style>
body {
	background-color: #f8f9fa;
	animation: colorchange 20s infinite;
}

.header {
	text-align: center;
	margin-bottom: 20px;
	color: #6c757d;
	font-size: 2em;
	text-shadow: 2px 2px #999999;
}

.list-group-item {
	font-size: 18px;
	border-radius: 20px;
	margin-bottom: 10px;
	transition: transform .2s;
}

.list-group-item:hover {
	transform: scale(1.05);
}

.btn-primary {
	width: 100%;
}
/* .container {
padding-top: 70px; 
} */
</style>
<body class="ops-page">
	<div class="topnav">

		<a id="back-link">Back</a>
		<script>
			var backLink = document.getElementById('back-link');
			backLink.href = 'http://' + window.location.hostname
					+ ':8086/inventory-ui/api/showMenu';
		</script>
		<!-- <a href="#orders">Orders</a>
    <a href="#reports">Reports</a>
    <a href="#settings">Settings</a> -->

		<div class="title">Warehouse Management System</div>
	</div>
	<div class="container ops-shell">

		<h1>Create LPN</h1>

		<!-- Create LPN form -->
		<form id="lpnForm" method="post"
			onsubmit="event.preventDefault(); submitForm();">
			<div class="form-group">
				<label for="lpn_name">LPN:</label> <input type="text" id="lpn"
					name="lpnNumber" class="form-control" required
					oninput="showFields()">
			</div>
			<div class="form-group" id="itemDiv" style="display: none;">
				<label for="item_name">Item:</label> <input type="text" id="item"
					name="itemName" class="form-control" required>
			</div>
			<div class="form-group" id="quantityDiv" style="display: none;">
				<label for="quantity">Quantity:</label> <input type="number"
					id="quantity" name="quantity" class="form-control" required>
			</div>
			<button type="submit" class="btn btn-primary">Submit</button>
		</form>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
	<script src="/inventory-ui/js/ui-feedback.js"></script>



	<!-- Add this script to show/hide fields -->
	<script type='text/javascript'>
		function showFields() {
			var lpn = document.getElementById('lpn').value;
			if (lpn) {
				document.getElementById('itemDiv').style.display = 'block';
				document.getElementById('quantityDiv').style.display = 'block';
			} else {
				document.getElementById('itemDiv').style.display = 'none';
				document.getElementById('quantityDiv').style.display = 'none';
			}
		}

		function submitForm() {
			var lpnNumber = document.getElementById('lpn').value;
			var itemName = document.getElementById('item').value;
			var quantity = document.getElementById('quantity').value;
			console.log('Submitting form with LPN:', lpnNumber, 'Item:', itemName, 'Quantity:', quantity);
			$.ajax({
				url : 'create',
				type : 'post',
				data : {
					lpnNumber : lpnNumber,
					itemName : itemName,
					quantity : quantity
				},
				success : function(response) {
					InventoryUI.success('LPN created successfully');
				},
				error : function(response) {
					InventoryUI.error('Error creating LPN');
				}
			});
		}
	</script>

</body>
</html>
