name: Build and Deploy to Tailscale Server

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Select deployment server'
        required: true
        type: choice
        options:
          - local-dev
          - local-qa
          - local-prod
      custom_ip:
        description: 'Or enter custom Tailscale IP (optional, overrides server_name)'
        required: false
        type: string
      custom_user:
        description: 'SSH user for custom IP (default: deploy)'
        required: false
        default: 'deploy'
        type: string
      branch:
        description: 'Git branch/tag to deploy'
        required: false
        type: string

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Create Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            
            <servers>
              <server>
                <id>custom-repo</id>
                <username>${{ secrets.MAVEN_REPO_USERNAME }}</username>
                <password>${{ secrets.MAVEN_REPO_PASSWORD }}</password>
              </server>
            </servers>
            
            <profiles>
              <profile>
                <id>custom-profile</id>
                <repositories>
                  <repository>
                    <id>custom-repo</id>
                    <url>${{ secrets.MAVEN_REPO_URL }}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            
            <activeProfiles>
              <activeProfile>custom-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF
      
      - name: Build with Maven
        id: build
        run: |
          mvn clean package -DskipTests
          JAR_FILE=$(ls target/*.jar | head -1)
          JAR_NAME=$(basename "$JAR_FILE")
          echo "artifact=${JAR_NAME}" >> $GITHUB_OUTPUT
          echo "Built artifact: ${JAR_NAME}"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app
          path: target/*.jar
          retention-days: 5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Determine Target Server
        id: server
        run: |
          if [ -n "${{ github.event.inputs.custom_ip }}" ]; then
            TARGET_IP="${{ github.event.inputs.custom_ip }}"
            TARGET_USER="${{ github.event.inputs.custom_user }}"
          else
            case "${{ github.event.inputs.server_name }}" in
              local-dev)
                TARGET_IP="${{ secrets.TAILSCALE_DEV_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_DEV_USER }}"
                ;;
              local-qa)
                TARGET_IP="${{ secrets.TAILSCALE_QA_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_QA_USER }}"
                ;;
              local-prod)
                TARGET_IP="${{ secrets.TAILSCALE_PROD_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_PROD_USER }}"
                ;;
              *)
                # For push events (auto-deploy to prod)
                TARGET_IP="${{ secrets.TAILSCALE_SERVER_IP }}"
                TARGET_USER="${{ secrets.TAILSCALE_DEPLOY_USER }}"
                ;;
            esac
          fi
          
          echo "target_ip=${TARGET_IP}" >> $GITHUB_OUTPUT
          echo "target_user=${TARGET_USER}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${TARGET_USER}@${TARGET_IP}"
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-app
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TAILSCALE_SSH_KEY }}" > ~/.ssh/tailscale_deploy_key
          chmod 600 ~/.ssh/tailscale_deploy_key
          ssh-keyscan -H ${{ steps.server.outputs.target_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: Deploy to Tailscale Server
        run: |
          JAR_FILE=$(ls *.jar | head -1)
          echo "Deploying ${JAR_FILE} to ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}"
          
          scp -i ~/.ssh/tailscale_deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${JAR_FILE}" \
              ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}:/opt/inventory-app/
          
          ssh -i ~/.ssh/tailscale_deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }} << 'EOF'
            set -e
            echo "Stopping existing application..."
            systemctl stop inventory-app || true
            sleep 2
            
            echo "Deploying new version..."
            cd /opt/inventory-app
            rm -f inventory-app-current.jar
            ln -s "${JAR_FILE}" inventory-app-current.jar
            
            echo "Starting application..."
            systemctl start inventory-app
            sleep 3
            
            echo "Checking application status..."
            systemctl status inventory-app
            echo "Deployment completed successfully!"
            EOF
      
      - name: Notify Deployment Success
        if: success()
        run: echo "✅ Application deployed successfully to ${{ steps.server.outputs.target_user }}@${{ steps.server.outputs.target_ip }}"
      
      - name: Notify Deployment Failure
        if: failure()
        run: echo "❌ Deployment failed - check logs above"
