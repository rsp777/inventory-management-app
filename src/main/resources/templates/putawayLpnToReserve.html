<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Putaway to Reserve</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="/inventory-ui/css/operations-ui.css">

</head>
<style>
body {
	background-color: #f8f9fa;
	animation: colorchange 20s infinite;
}

.header {
	text-align: center;
	margin-bottom: 20px;
	color: #6c757d;
	font-size: 2em;
	text-shadow: 2px 2px #999999;
}

.list-group-item {
	font-size: 18px;
	border-radius: 20px;
	margin-bottom: 10px;
	transition: transform .2s;
}

.list-group-item:hover {
	transform: scale(1.05);
}

.btn-primary {
	width: 100%;
}
/* .container {
 padding-top: 70px; 
 } */
</style>
<body class="ops-page">
	<div class="topnav">

		<a id="back-link">Back</a>
		<script>
			var backLink = document.getElementById('back-link');
			backLink.href = 'http://' + window.location.hostname
					+ ':8086/api/showMenu';
		</script>


		<div class="title">Warehouse Management System</div>
	</div>
	<div class="container ops-shell">
		<h1>Putaway to Reserve</h1>
		<input type="hidden" id="responseMessage"
			th:value="${responseMessage}"></input>


		<form id="lpnForm" method="post"
			onsubmit="event.preventDefault(); submitForm();">
			<div class="form-group">
				<label for="lpn_name">LPN:</label> <input type="text" id="lpn"
					name="lpn_name" class="form-control" required
					oninput="showFields()">
			</div>
			<div class="form-group" id="resvLocDiv" style="display: none;">
				<label for="locationCode">Rloc:</label> <input type="text" id="resv"
					name="locationCode" class="form-control" required>
			</div>
			<button type="submit" class="btn btn-primary">Submit</button>
		</form>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
	<script src="/inventory-ui/js/ui-feedback.js"></script>



	<!-- Add this script to show/hide fields -->
	<script type='text/javascript'>
		function showFields() {
			var lpn = document.getElementById('lpn').value;
			if (lpn) {
				document.getElementById('resvLocDiv').style.display = 'block';
			} else {
				document.getElementById('resvLocDiv').style.display = 'none';
			}
		}

		function submitForm() {
			var lpnNumber = document.getElementById('lpn').value;
			var locationCode = document.getElementById('resv').value;
			console.log('LPN : ' + lpnNumber + ' , Reserve Location : ' + locationCode);

			const ajaxRequest = {
				url : '/inventory-ui/lpn/' + encodeURIComponent(lpnNumber) + '/putaway-reserve',
				type : 'post',
				data : {
					locationCode : locationCode
				},
				success : function(response) {
					var msg = (response && response.message) ? response.message : 'LPN moved to reserve location';
					console.log('Response Message: ' + msg);
					InventoryUI.success(msg);
				},
				error : function(xhr) {
					var errMsg = 'Error locating LPN';
					if (xhr.responseJSON && xhr.responseJSON.error) {
						errMsg = xhr.responseJSON.error;
					}
					InventoryUI.error(errMsg);
				}
			}
			$.ajax(ajaxRequest);

		}
	</script>

</body>
</html>
