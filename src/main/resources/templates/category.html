<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Category Management</title>
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="/inventory-ui/css/operations-ui.css">
	
<style>
body {
	background-color: #f8f9fa;
}

.container {
	max-width: 960px;
	margin-top: 2rem;
	padding: 2rem;
	background-color: #fff;
	border-radius: 0.5rem;
	box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
}

table {
	margin-top: 2rem;
}
table.scrolldown {
            width: 100%;

            /* border-collapse: collapse; */
            border-spacing: 0;
            border: 2px solid black;
        }

.table th, .table td {
	vertical-align: middle;
}

.form-group {
	margin-top: 2rem;
}

#saveCategoryButton, #toggleButton {
  display: inline-block;
  margin-right: 10px; /* Add a little space between buttons */
}
.scrollable-container {
    width: 100%;
    height: 600px; 
    overflow-y: auto; 
}

.refresh-toolbar {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 1rem;
	flex-wrap: wrap;
	margin: 1rem 0;
	padding: 0.85rem 1rem;
	border: 1px solid #d7e3f3;
	border-radius: 0.5rem;
	background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
}

.refresh-toolbar-meta {
	display: flex;
	flex-direction: column;
	gap: 0.25rem;
}

.refresh-toolbar-controls {
	display: flex;
	align-items: center;
	gap: 0.5rem;
	flex-wrap: wrap;
}

.refresh-toolbar-seconds {
	width: 88px;
}

  .scrollable-container table {
    width: 100%;
  }

  .scrollable-container thead {
    position: sticky;
    top: 0;
    background-color: #f8f9fa; 
	z-index: 0; 

  }
/* .icon-container {
    display: flex;
    align-items: right;
   
} */
</style>
</head>
<body class="ops-page">

<div class="topnav">

          class="dropdown-menu dropdown-menu-left"
          aria-labelledby="dropdownMenuButton"
        >
          <div th:each="menu : ${nav_menus}">

              <a
                class="dropdown-item dropdown-menu-main-content"

                th:href="@{${menu.menu_link}}"
                th:text="${menu.menuName}"

              >
                <span
                  th:if="${menu != null and menu.menu_type == 'PARENT_UI'}"
                  class="arrow"
                >
                  &#9654;
                </span>
              </a>

              <!-- Submenu -->
              <div
                class="submenu"
                th:if="${menu != null and menu.menu_type != null and menu.menu_type == 'PARENT_UI'}"
              >
                <a
                  class="submenu-item"
                  th:each="submenu : ${menu.children}"
                  th:href="@{${submenu.menu_link}}"
                  th:text="${submenu.menuName}"

            </div>

        </div>
	</div>
  <div class="title">Warehouse Management System</div>
 <span class="icon-name" th:text="${user_name}"></span>
 &nbsp;&nbsp;&nbsp;&nbsp;

<div class="dropdown">
	<button style="background-color: #333;border: none;" class=" btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
		<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-person-circle" viewBox="0 0 16 16">
			<path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
			<path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
		</svg>
	</button>
	<div class="dropdown-menu dropdown-menu-left" aria-labelledby="dropdownMenuButton">
	  <a class="dropdown-item"  href="#">Account</a>
	  <a class="dropdown-item"th:href="@{${settings_url.menu_link}}"th:text="${settings_url.menuName}"></a>
	  <a class="dropdown-item" th:href="@{${logout_url.menu_link}}"th:text="${logout_url.menuName}"></a>
	  <!-- <a class="dropdown-item"  href="#">Logout</a> -->
	</div>
  </div>
  &nbsp;&nbsp;&nbsp;&nbsp;
</div>

<!-- </div> -->
	<div class="container ops-shell">
		
		<h1 class="text-center">Category Management</h1>
		<input type="hidden" id="responseMessage" th:value="${responseMessage}"/></input>
		<div class="refresh-toolbar">
			<div class="refresh-toolbar-meta">
				<span class="badge badge-info" id="realtimeRefreshStatus">Realtime On</span>
				<small class="text-muted" id="realtimeRefreshLastUpdated">Last updated: Not yet</small>
			</div>
			<div class="refresh-toolbar-controls">
				<input type="number" min="5" step="5" id="realtimeRefreshSeconds" class="form-control form-control-sm refresh-toolbar-seconds" value="10">
				<button type="button" class="btn btn-outline-primary btn-sm" onclick="applyRealtimeRefreshInterval()">Apply</button>
				<button type="button" class="btn btn-outline-secondary btn-sm" id="toggleRealtimeRefreshButton" onclick="toggleRealtimeRefresh()">Pause Realtime</button>
				<button type="button" class="btn btn-primary btn-sm" onclick="refreshCurrentPage(true)"><i class="fa fa-refresh"></i> Refresh Now</button>
			</div>
		</div>
		<!-- Category table -->
		<div class="scrollable-container">	
			<table class="table table-striped" data-enhance-table="true">
				<thead class="thead-dark">
					<tr>
						<th scope="col">#</th>
						<th scope="col">Category Name</th>
						<th scope="col">Actions</th>
					</tr>
				</thead>
			
				<tbody>
					<tr th:each="category : ${categories}">
						<th scope="row" th:text="${category.category_id}"></th>
						<td th:text="${category.category_name}"></td>
						<td>
							<button th:data-category-id="${category.category_id}"
								th:data-category-name="${category.category_name}"
								th:disabled="${uiActions == null or !uiActions.manageCategories}"
								onclick="editCategory(this.getAttribute('data-category-id'), this.getAttribute('data-category-name'))"
								class="btn btn-primary">Edit</button>
							<button th:data-category-id="${category.category_id}"
								th:data-category-name="${category.category_name}"
								th:disabled="${uiActions == null or !uiActions.manageCategories}"
								onclick="confirmCategoryDeletion(this.getAttribute('data-category-id'),this.getAttribute('data-category-name'), true)"
								class="btn btn-danger">Delete</button>

						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="form-group" id="categoryDiv" style="display: none;">
			<label for="category">Category</label> <input type="text"
				id="category" name="category" class="form-control" required>
			&nbsp<input type="button" class="btn btn-primary" value="Save"
				th:disabled="${uiActions == null or !uiActions.manageCategories}"
				onclick="submitForm()" id="saveButton" style="display: none;">
			&nbsp<button 
				class="btn btn-primary" 
				onclick="cancelAddCategory()" id="toggleCancelButton" style="display: none;">Cancel</button>
			<div>
				<button  class="btn btn-primary"
				th:disabled="${uiActions == null or !uiActions.manageCategories}"
				onclick="saveChanges()" id="saveCategoryButton"
				style="display: none;"> Save</button>
				&nbsp
				<button 
				class="btn btn-primary" 
				onclick="cancelEdit()" id="toggleButton" style="display: none;">Cancel</button>
			
			</div>
			
		</div>
		<input type="button" class="btn btn-primary" value="Add Category"
			th:disabled="${uiActions == null or !uiActions.manageCategories}"
			onclick="showFields()" id="addCategoryButton">
	</div>
	<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
	<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="/inventory-ui/js/ui-feedback.js"></script>
	<script src="/inventory-ui/js/table-enhancements.js"></script>
	
	<script th:inline='javascript'>

		var isButtonShown = false;
		var currentCategoryName = null;
		const REFRESH_STORAGE_KEY = 'inventory.page.refresh.category';
		const DEFAULT_REFRESH_INTERVAL_MS = 10000;
		const MIN_REFRESH_INTERVAL_SECONDS = 5;
		var realtimeRefreshTimer = null;
		var realtimeRefreshEnabled = true;
		var currentRealtimeIntervalMs = DEFAULT_REFRESH_INTERVAL_MS;
		var lastRefreshTimestamp = null;

		function loadRefreshSettings() {
			try {
				var savedSettings = JSON.parse(localStorage.getItem(REFRESH_STORAGE_KEY) || '{}');
				if (typeof savedSettings.enabled === 'boolean') {
					realtimeRefreshEnabled = savedSettings.enabled;
				}
				if (typeof savedSettings.intervalMs === 'number' && savedSettings.intervalMs >= (MIN_REFRESH_INTERVAL_SECONDS * 1000)) {
					currentRealtimeIntervalMs = savedSettings.intervalMs;
				}
				if (savedSettings.lastUpdated) {
					lastRefreshTimestamp = savedSettings.lastUpdated;
				}
			} catch (error) {
				console.warn('Unable to load refresh settings', error);
			}

			if (!lastRefreshTimestamp) {
				lastRefreshTimestamp = new Date().toISOString();
				persistRefreshSettings();
			}
		}

		function persistRefreshSettings() {
			localStorage.setItem(REFRESH_STORAGE_KEY, JSON.stringify({
				enabled: realtimeRefreshEnabled,
				intervalMs: currentRealtimeIntervalMs,
				lastUpdated: lastRefreshTimestamp
			}));
		}

		function formatRefreshTimestamp(timestamp) {
			if (!timestamp) {
				return 'Not yet';
			}

			var parsedDate = new Date(timestamp);
			if (Number.isNaN(parsedDate.getTime())) {
				return 'Not yet';
			}

			return parsedDate.toLocaleString();
		}

		function updateRefreshControls() {
			var statusBadge = document.getElementById('realtimeRefreshStatus');
			var lastUpdatedLabel = document.getElementById('realtimeRefreshLastUpdated');
			var toggleButton = document.getElementById('toggleRealtimeRefreshButton');
			var intervalInput = document.getElementById('realtimeRefreshSeconds');

			if (statusBadge) {
				statusBadge.textContent = realtimeRefreshEnabled ? 'Realtime On' : 'Realtime Paused';
				statusBadge.className = realtimeRefreshEnabled ? 'badge badge-info' : 'badge badge-secondary';
			}

			if (lastUpdatedLabel) {
				lastUpdatedLabel.textContent = 'Last updated: ' + formatRefreshTimestamp(lastRefreshTimestamp);
			}

			if (toggleButton) {
				toggleButton.textContent = realtimeRefreshEnabled ? 'Pause Realtime' : 'Resume Realtime';
				toggleButton.className = realtimeRefreshEnabled ? 'btn btn-outline-secondary btn-sm' : 'btn btn-outline-success btn-sm';
			}

			if (intervalInput) {
				intervalInput.value = currentRealtimeIntervalMs / 1000;
			}
		}

		function stopRealtimeRefresh() {
			if (realtimeRefreshTimer) {
				clearInterval(realtimeRefreshTimer);
				realtimeRefreshTimer = null;
			}
		}

		function startRealtimeRefresh() {
			stopRealtimeRefresh();
			if (!realtimeRefreshEnabled) {
				return;
			}

			realtimeRefreshTimer = setInterval(function() {
				refreshCurrentPage(false);
			}, currentRealtimeIntervalMs);
		}

		function isRefreshBlocked() {
			var categoryEditor = document.getElementById('categoryDiv');
			return categoryEditor && categoryEditor.style.display !== 'none';
		}

		function refreshCurrentPage(forceRefresh) {
			if (!forceRefresh && isRefreshBlocked()) {
				return;
			}

			lastRefreshTimestamp = new Date().toISOString();
			persistRefreshSettings();
			window.location.reload();
		}

		function toggleRealtimeRefresh() {
			realtimeRefreshEnabled = !realtimeRefreshEnabled;
			persistRefreshSettings();
			updateRefreshControls();

			if (realtimeRefreshEnabled) {
				startRealtimeRefresh();
			} else {
				stopRealtimeRefresh();
			}
		}

		function applyRealtimeRefreshInterval() {
			var intervalInput = document.getElementById('realtimeRefreshSeconds');
			var seconds = parseInt(intervalInput.value, 10);

			if (Number.isNaN(seconds) || seconds < MIN_REFRESH_INTERVAL_SECONDS) {
				Swal.fire('Invalid interval', 'Enter a refresh interval of at least 5 seconds.', 'warning');
				intervalInput.value = currentRealtimeIntervalMs / 1000;
				return;
			}

			currentRealtimeIntervalMs = seconds * 1000;
			persistRefreshSettings();
			updateRefreshControls();

			if (realtimeRefreshEnabled) {
				startRealtimeRefresh();
			}
		}

		document.addEventListener('DOMContentLoaded', function() {
			loadRefreshSettings();
			updateRefreshControls();
			if (realtimeRefreshEnabled) {
				startRealtimeRefresh();
			}

			var intervalInput = document.getElementById('realtimeRefreshSeconds');
			if (intervalInput) {
				intervalInput.addEventListener('keydown', function(event) {
					if (event.key === 'Enter') {
						event.preventDefault();
						applyRealtimeRefreshInterval();
					}
				});
			}
		});

		function getUserName(jwtToken) {
 		 var base64Payload = jwtToken.split(".")[1];
  		 var payload = decodeURIComponent(
    	 atob(base64Payload)
      	   .split("")
           .map(function (c) {
           return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
           })
          .join("")
         );
         return JSON.parse(payload).sub;
}


		function showFields() {
			if (!isButtonShown) {
				document.getElementById('categoryDiv').style.display = 'block';
				document.getElementById('saveButton').style.display = 'block';
				document.getElementById('toggleCancelButton').style.display = 'block';
				document.getElementById('addCategoryButton').style.display = 'none';
				isCategoryShown = true;
			} else {
				submitForm();
			}
		}
		function cancelAddCategory() {
		    // Hide the category input field, save button, and cancel button
		    document.getElementById('categoryDiv').style.display = 'none';
		    document.getElementById('saveCategoryButton').style.display = 'none';
		    document.getElementById('toggleCancelButton').style.display = 'none';
			
		    // Show the Add Category button
		    document.getElementById('addCategoryButton').style.display = 'block';
			document.getElementById('category').value = null;
		    isCategoryShown = false;
		}
		function submitForm() {
			var category_name = document.getElementById('category').value;
			if (category_name!='') {
				const ajaxRequest = {
				url : 'categoryAdd/' + category_name,
				type : 'post',
				success : function(response, textStatus, xhr) {
					console.log("Status Code:", xhr.status
							+ ", Status Message " + textStatus);
										              
						var parser = new DOMParser();
						var xmlDoc = parser.parseFromString(xhr.responseText, "text/html");
						var targetTag = xmlDoc.querySelector("#responseMessage"); // Replace with your actual tag ID
						// console.log(xmlDoc);
						console.log('Response Message '+targetTag.value);
                    
					InventoryUI.success(targetTag.value);
					document.getElementById('categoryDiv').style.display = 'none';
					document.getElementById('addCategoryButton').style.display = 'block';
					isCategoryShown = false;
					location.reload();

				},
				error : function(response) {
					InventoryUI.error('Error adding category');
					location.reload();
				}
			};
			$.ajax(ajaxRequest);
			}
			else{
				InventoryUI.warning("Please enter category name");
			}

			
		}
		function cancelEdit() {
		    // Hide the category input field, save button, and cancel button
		    document.getElementById('categoryDiv').style.display = 'none';
		    document.getElementById('saveCategoryButton').style.display = 'none';
		    document.getElementById('toggleButton').style.display = 'none';

		    // Show the Add Category button
		    document.getElementById('addCategoryButton').style.display = 'block';
			document.getElementById('category').value = null;

		}

		function editCategory(category_id, category_name) {
			console.log("Editing : " + category_name);
			// Show the category input field with the current category name
			document.getElementById('categoryDiv').style.display = 'block';
			document.getElementById('category').value = category_name;
			document.getElementById('saveButton').style.display = 'none';
			document.getElementById('addCategoryButton').style.display = 'none';
			document.getElementById('toggleCancelButton').style.display = 'none';
			document.getElementById('toggleButton').style.display = 'block';
			document.getElementById('saveCategoryButton').style.display = 'block';
			isCategoryShown = true;
			currentCategoryName = category_name;
		}
		function saveChanges() {
			var updated_category_name = document.getElementById('category').value;
			var data = JSON.stringify({
				'category_name' : updated_category_name
			});
			console.log(updated_category_name);
			if (updated_category_name!='') {
			$.ajax({
						url : 'categoryEdit/' + currentCategoryName,
						type : 'put',
						contentType : 'application/json',
						data : data,

						success : function(response, textStatus, xhr) {
							console.log("Status code:", xhr.status + ", "
									+ textStatus);
									
							InventoryUI.success('Category updated successfully');
							document.getElementById('categoryDiv').style.display = 'none';
							document.getElementById('toggleButton').value = 'Add Category';
							document.getElementById('saveButton').style.display = 'none';
							isCategoryShown = false;
							currentCategoryName = null;
							location.reload();
						},
						error : function(response) {
							InventoryUI.error('Error updating category');
							location.reload();
						}
					});
				}
				else{
					InventoryUI.warning('Please enter a category name!');
				}
		}
		function confirmCategoryDeletion(category_id,category_name, deleteFlag) {
			if (deleteFlag) {
//				const confirmation = window
//						.confirm(`Are you sure you want to delete category '${category_name}'?`);
//				if (confirmation) {
	//				deleteCategory(category_name);
			//	}
				 Swal.fire({
			            title: 'Are you sure?',
			            text: `Are you sure you want to delete category '${category_name}'?`,
			            icon: 'warning',
			            showCancelButton: true,
			            confirmButtonColor: '#3085d6',
			            cancelButtonColor: '#d33',
			            confirmButtonText: 'Yes, delete it!',
			            cancelButtonText: 'No, cancel!'
			        }).then((result) => {
			            if (result.isConfirmed) {
			                deleteCategory(category_id);
			            }
			        });
			    }
		}

		function deleteCategory(category_id) {
			console.log(category_id);

			// Proceed with deletion if user clicks "Yes" button
			$
					.ajax({
						url : 'deleteCategory/' + category_id,
						type : 'delete',
						 success: function(response, textStatus, xhr) {
					            console.log("Status code:", xhr.status + ", " + textStatus);
					            Swal.fire('Deleted!', 'Category deleted successfully', 'success').then((result) => {
					                if (result.isConfirmed) {
					                    location.reload(); // Reload the page
					                }
					            });
					        },
	
					        error: function(response) {
					            Swal.fire('Error!', 'Error deleting category', 'error');
					        }
					});
		}
	</script>
</body>
</html>
