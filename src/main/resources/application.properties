# Network timeouts used by external HTTP integrations
connection.timeout=${HTTP_CONNECTION_TIMEOUT:60}
response.timeout=${HTTP_RESPONSE_TIMEOUT:60}
connection.request.timeout=${HTTP_CONNECTION_REQUEST_TIMEOUT:60}

# Application identity and web settings
spring.application.name=Inventory Management App
server.port=${SERVER_PORT:8086}
server.servlet.context-path=/inventory-ui

# Primary datasource
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-server.tailc9a488.ts.net:3306/menu}
spring.datasource.username=${DB_USERNAME:ravi}
spring.datasource.password=${DB_PASSWORD:ravi}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:100}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:240000}

# JPA and Jackson
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssZ

# Spring framework toggles
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.autoconfigure.exclude=io.github.arun0009.pulse.autoconfigure.PulseAutoConfiguration,io.github.arun0009.pulse.autoconfigure.PulseWebAutoConfiguration,io.github.arun0009.pulse.async.internal.ExecutorConfiguration,io.github.arun0009.pulse.cache.internal.PulseCaffeineConfiguration,io.github.arun0009.pulse.container.internal.PulseContainerMemoryConfiguration,io.github.arun0009.pulse.db.internal.PulseDbConfiguration,io.github.arun0009.pulse.dependencies.internal.PulseDependenciesConfiguration,io.github.arun0009.pulse.guardrails.internal.SamplingConfiguration,io.github.arun0009.pulse.metrics.internal.CommonTagsConfiguration,io.github.arun0009.pulse.openfeature.internal.PulseOpenFeatureConfiguration,io.github.arun0009.pulse.priority.internal.PulsePriorityConfiguration,io.github.arun0009.pulse.profiling.internal.PulseProfilingConfiguration,io.github.arun0009.pulse.propagation.internal.ApacheHttpClient5PropagationConfiguration,io.github.arun0009.pulse.propagation.internal.KafkaPropagationConfiguration,io.github.arun0009.pulse.propagation.internal.OkHttpPropagationConfiguration,io.github.arun0009.pulse.propagation.internal.RestClientPropagationConfiguration,io.github.arun0009.pulse.propagation.internal.RestTemplatePropagationConfiguration,io.github.arun0009.pulse.propagation.internal.WebClientPropagationConfiguration,io.github.arun0009.pulse.resilience.internal.PulseResilience4jConfiguration,io.github.arun0009.pulse.resilience.internal.PulseRetryAmplificationConfiguration,io.github.arun0009.pulse.tenant.internal.PulseTenantConfiguration,io.github.arun0009.pulse.ext.internal.PulseFeatureConfiguration

# Logging
logging.level.root=INFO
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.data.jpa=INFO
logging.level.org.apache=OFF
logging.level.kafka=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.file.name=${LOG_FILE_NAME:logs/invnapp.log}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{0} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{0} - %msg%n
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE_NAME_PATTERN:logs/invnapp.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:7}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}
logging.logback.rollingpolicy.clean-history-on-start=${LOG_CLEAN_HISTORY_ON_START:false}

# Actuator
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.build.enabled=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.enable-spring-el-compiler=true

# Service discovery
eureka.client.enabled=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:100.126.130.66:29092,100.126.130.66:29093,100.126.130.66:29094}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:consumer_group3}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.max.poll.interval.ms=30000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Security
jwt.secret=${JWT_SECRET:secretKey}

# External API defaults
external.api.url=${EXTERNAL_API_URL:http://localhost:8085}
external.api.timeout=${EXTERNAL_API_TIMEOUT_MS:30000}
external.api.retry-attempts=${EXTERNAL_API_RETRY_ATTEMPTS:3}

# Listener runtime health monitoring
listener.runtime.monitor.enabled=${LISTENER_RUNTIME_MONITOR_ENABLED:true}
listener.runtime.monitor.interval-ms=${LISTENER_RUNTIME_MONITOR_INTERVAL_MS:30000}
listener.runtime.connect-timeout-ms=${LISTENER_RUNTIME_CONNECT_TIMEOUT_MS:2000}

# Listener owning-service control integration
listener.runtime.control-enabled=${LISTENER_RUNTIME_CONTROL_ENABLED:true}
# Supported formats:
# 1) key=value pairs: users-service=http://localhost:8085,orders-service=http://localhost:8087
# 2) plain URLs: http://localhost:8086,http://localhost:8085
listener.runtime.control-base-urls=${LISTENER_RUNTIME_CONTROL_BASE_URLS:inventory-management-system=http://localhost:8085,inventory-management-app=http://localhost:8086}