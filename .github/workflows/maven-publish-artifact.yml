name: Build and Publish Artifact to Maven Registry
on:
  workflow_dispatch:

jobs:
  connect-to-tailscale-network:
    runs-on: ubuntu-latest
    steps:
      - name: Connect Tailscale
        # You may pin to the exact commit or the version.
        # uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d
        uses: tailscale/github-action@v2
        with:
          # Your Tailscale OAuth Client ID.
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          # Your Tailscale OAuth Client Secret.
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Comma separated list of Tags to be applied to nodes. The OAuth client must have permission to apply these tags.
          tags: tag:sop

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Write Maven settings.xml
        run: |
          mkdir -p $HOME/.m2
          echo "${{ secrets.MAVEN_SETTINGS }}" > $HOME/.m2/settings.xml

      - name: Build and Publish to GitHub Packages Apache Maven
        run: mvn clean deploy -s $HOME/.m2/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
