name: Build and Depploy Artifact to Maven Registry
on:
  workflow_dispatch:

jobs:
  connect-to-tailscale-network:
    runs-on: ubuntu-latest
    steps:
      - name: Connect Tailscale
        # You may pin to the exact commit or the version.
        # uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d
        uses: tailscale/github-action@v2
        with:
          # Your Tailscale OAuth Client ID.
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          # Your Tailscale OAuth Client Secret.
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Comma separated list of Tags to be applied to nodes. The OAuth client must have permission to apply these tags.
          tags: tag:sop

  build:
    runs-on: ubuntu-latest
    needs: connect-to-tailscale-network
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: maven-settings-action
        # You may pin to the exact commit or the version.
        # uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788
        uses: s4u/maven-settings-action@v4.0.0
        with:
          # servers definition in json array, eg: [{"id": "serverId", "username": "username", "password": "password"}]
          servers:
            [
              {
                "id": "serverId",
                "username": "username",
                "password": "password",
              },
            ]
          # list of custom repositories as json array, e.g: [{"id":"repoId","name":"repoName","url":"url","snapshots":{"enabled":true}}]
          repositories:
            [
              {
                "id": "repoId",
                "name": "repoName",
                "url": "url",
                "snapshots": { "enabled": true },
              },
            ]
      - name: Maven Build
        run: mvn clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: maven-settings-action
        # You may pin to the exact commit or the version.
        # uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788
        uses: s4u/maven-settings-action@v4.0.0
        with:
          # servers definition in json array, eg: [{"id": "serverId", "username": "username", "password": "password"}]
          servers:
            [
              {
                "id": "serverId",
                "username": "username",
                "password": "password",
              },
            ]
          # list of custom repositories as json array, e.g: [{"id":"repoId","name":"repoName","url":"url","snapshots":{"enabled":true}}]
          repositories:
            [
              {
                "id": "repoId",
                "name": "repoName",
                "url": "url",
                "snapshots": { "enabled": true },
              },
            ]
      - name: Run tests
        run: mvn test

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: maven-settings-action
        # You may pin to the exact commit or the version.
        # uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788
        uses: s4u/maven-settings-action@v4.0.0
        with:
          # servers definition in json array, eg: [{"id": "serverId", "username": "username", "password": "password"}]
          servers:
            [
              {
                "id": "serverId",
                "username": "username",
                "password": "password",
              },
            ]
          # list of custom repositories as json array, e.g: [{"id":"repoId","name":"repoName","url":"url","snapshots":{"enabled":true}}]
          repositories:
            [
              {
                "id": "repoId",
                "name": "repoName",
                "url": "url",
                "snapshots": { "enabled": true },
              },
            ]
      - name: Publish to GitHub Packages Apache Maven
        run: mvn deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
