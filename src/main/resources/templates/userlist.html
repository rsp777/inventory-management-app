<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>User List</title>

<style>
body {
	background-color: #f4f6f9;
}

.container {
	max-width: 1280px;
	margin-top: 2rem;
	padding: 1.5rem 1.75rem;
	background-color: #fff;
	border-radius: 0.5rem;
	box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
}

.page-title {
	font-size: 1.8rem;
	font-weight: 700;
	margin-bottom: 0;
}

.table th, .table td {
	vertical-align: middle;
}

.table td {
	font-size: 0.92rem;
}

.table thead th {
	white-space: nowrap;
}


.toolbar {
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 0.75rem;
	margin-top: 0.75rem;
}

.nav-shortcuts {
	display: flex;
	flex-wrap: wrap;
	gap: 0.45rem;
}

.nav-shortcuts .btn {
	border-radius: 999px;
	padding: 0.28rem 0.72rem;
}

.nav-shortcuts .btn.active {
	background: #0d6efd;
	border-color: #0d6efd;
	color: #fff;
}

.scrollable-container {
	width: 100%;
	height: 560px;
	overflow-y: auto;
	margin-top: 0.85rem;
	border: 1px solid #dee2e6;
	border-radius: 0.45rem;
}


.scrollable-container table {
	width: 100%;
	margin-bottom: 0;
}


.scrollable-container thead {
	position: sticky;
	top: 0;
	background-color: #f8f9fa;
	z-index: 2;
}


.name-cell {
	font-weight: 600;
	color: #2f3a4a;
}

.list-cell {
	display: flex;
	flex-wrap: wrap;
	gap: 0.28rem;
}

.chip {
	font-size: 0.74rem;
	padding: 0.28rem 0.5rem;
	border-radius: 999px;
	background: #eef3ff;
	border: 1px solid #d6e2ff;
	color: #334f8d;
}

.chip-muted {
	font-size: 0.74rem;
	padding: 0.28rem 0.5rem;
	border-radius: 999px;
	background: #f4f5f6;
	border: 1px solid #e0e4e8;
	color: #5b6570;
}

.table-actions .btn {
	min-width: 74px;
}

.modal-body .form-group {
	margin-top: 0;
	margin-bottom: 0.9rem;
}

.modal-body label {
	font-weight: 600;
}

.filter-panel {
	background: #f8f9fa;
	border: 1px solid #dee2e6;
	border-radius: 0.45rem;
	padding: 0.7rem 0.8rem;
	margin-top: 0.85rem;
}

.admin-nav-shell {
	margin-top: 0.85rem;
	padding: 0.8rem 0.95rem;
	background: linear-gradient(135deg, #f7faff 0%, #eef4ff 100%);
	border: 1px solid #dfe8ff;
	border-radius: 0.55rem;
}

.admin-nav-head {
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 0.5rem;
	margin-bottom: 0.55rem;
}

.admin-nav-title {
	font-size: 0.92rem;
	font-weight: 700;
	color: #344767;
	margin: 0;
}

.admin-nav-meta {
	font-size: 0.76rem;
	color: #5f6b7a;
	background: #ffffff;
	border: 1px solid #dfe8ff;
	padding: 0.2rem 0.5rem;
	border-radius: 999px;
}

.admin-pills {
	display: flex;
	flex-wrap: wrap;
	gap: 0.42rem;
}

.admin-pill {
	display: inline-flex;
	align-items: center;
	gap: 0.35rem;
	padding: 0.32rem 0.72rem;
	border-radius: 999px;
	border: 1px solid #c9d8ff;
	background: #fff;
	color: #37507a;
	text-decoration: none;

	font-weight: 600;
}

.admin-pill:hover {

	color: #243b63;
}

.admin-pill.active {
	background: #315ea8;
	border-color: #315ea8;
	color: #fff;
}

@media (max-width: 768px) {
	.container {
		padding: 1rem;
	}

	.page-title {

	}

	.scrollable-container {

	}
}
</style>

}
function deColourFieldAndNull(fieldId){
	var field = document.getElementById(fieldId);
	field.style.borderColor = 'grey';
	if (field.tagName === 'SELECT') {
		Array.from(field.options).forEach(function(option) {
			option.selected = false;
		});
		return;
	}
	field.value = null;
 }

function setSelectedOptionsFromText(selectId, rawValues) {
	var select = document.getElementById(selectId);
	if (!select) return;
	Array.from(select.options).forEach(function(option) {
		option.selected = false;
	});
	if (!rawValues) return;
	var selectedValues = String(rawValues)
		.replace(/[\[\]"]/g, '')
		.split(',')
		.map(function(v) { return normalizeText(v); })
		.filter(function(v) { return v.length > 0; });
	Array.from(select.options).forEach(function(option) {
		if (selectedValues.indexOf(normalizeText(option.value)) !== -1) {
			option.selected = true;
		}
	});
}

function setSelectedRoleOptions(rawRoleIds, rawRoleNames) {
	var select = document.getElementById('roles');
	if (!select) return;
	Array.from(select.options).forEach(function(option) {
		option.selected = false;
	});
	var selectedIds = String(rawRoleIds || '')
		.replace(/[\[\]"]/g, '')
		.split(',')
		.map(function(v) { return v.trim(); })
		.filter(function(v) { return v.length > 0; });
	var selectedNames = String(rawRoleNames || '')
		.replace(/[\[\]"]/g, '')
		.split(',')
		.map(function(v) { return normalizeText(v); })
		.filter(function(v) { return v.length > 0; });
	Array.from(select.options).forEach(function(option) {
		var matchesId = selectedIds.indexOf(String(option.value).trim()) !== -1;
		var roleName = normalizeText(option.getAttribute('data-role-name') || option.textContent);
		var matchesName = selectedNames.indexOf(roleName) !== -1;
		if (matchesId || matchesName) {
			option.selected = true;
		}
	});
	originalRoleIds = Array.from(select.selectedOptions).map(function(option) {
		return String(option.value);
	});
}

function setUserFormMode(isExistingUser) {
	['firstname', 'middlename', 'lastname', 'username', 'email'].forEach(function(fieldId) {
		var field = document.getElementById(fieldId);
		if (field) {
			field.readOnly = isExistingUser;
		}
	});
	var permissionsField = document.getElementById('permissions');
	if (permissionsField) {
		permissionsField.disabled = isExistingUser;
	}
}

function getSelectedRoleNames() {
	return Array.from(document.getElementById('roles').selectedOptions).map(function(option) {
		return option.getAttribute('data-role-name') || option.textContent;
	});
}

function getSelectedRoleIds() {
	return Array.from(document.getElementById('roles').selectedOptions).map(function(option) {
		return String(option.value);
	});
}

function getAjaxSuccessMessage(response, xhr, fallbackMessage) {
	if (typeof response === 'string' && response.trim().length > 0) {
		return response.trim();
	}
	if (response && typeof response === 'object') {
		if (response.responseMessage) return response.responseMessage;
		if (response.message) return response.message;
	}
	if (xhr && xhr.responseText) {
		var parser = new DOMParser();
		var xmlDoc = parser.parseFromString(xhr.responseText, 'text/html');
		var targetTag = xmlDoc.querySelector('#responseMessage');
		if (targetTag && targetTag.value && targetTag.value.trim().length > 0) {
			return targetTag.value.trim();
		}
		if (typeof xhr.responseText === 'string' && xhr.responseText.trim().length > 0) {
			return xhr.responseText.trim();
		}
	}
	return fallbackMessage;
}

function validateField(fieldId) {
    const field = document.getElementById(fieldId);
    const fieldValue = field.value;
    if (fieldValue === '') {
        field.style.borderColor = 'red';
        return false;
    }
    if (fieldId === 'email') {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(fieldValue)) {
            field.style.borderColor = 'red';
            return false;
        }
    }
    return true;
}

		function saveEditItem() {
			var userId = document.getElementById('userId').value;
			var selectedRoleIds = getSelectedRoleIds();
			var addedRoleIds = selectedRoleIds.filter(function(roleId) {
				return originalRoleIds.indexOf(String(roleId)) === -1;
			});
			var removedRoleIds = originalRoleIds.filter(function(roleId) {
				return selectedRoleIds.indexOf(String(roleId)) === -1;
			});

			if (!userId) {
				InventoryUI.error('User ID is required to assign roles.');
				return;
			}
			if (addedRoleIds.length === 0 && removedRoleIds.length === 0) {
				InventoryUI.info('No role changes detected.');
				return;
			}

			var saveBtn = document.querySelector('#editItemButton .btn-primary');
			if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

			var requests = addedRoleIds.map(function(roleId) {
				return axios.post('/inventory-ui/api/assign/roles/user/' + userId + '/role/' + roleId);
			});
			removedRoleIds.forEach(function(roleId) {
				requests.push(axios.delete('/inventory-ui/api/unassign/roles/user/' + userId + '/role/' + roleId));
			});

			Promise.all(requests)
				.then(function(results) {
					if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
					var message = results.length === 1 && results[0] && results[0].data
						? getAjaxSuccessMessage(results[0].data, null, 'User updated successfully.')
						: 'User updated successfully.';
					InventoryUI.success(message);
					setTimeout(function() { location.reload(); }, 900);
				})
				.catch(function(error) {
					if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
					var responseMessage = error && error.response && error.response.data ? error.response.data : 'Failed to update user roles.';
					InventoryUI.error(responseMessage);
				});
		}

		function normalizeText(value) {
			return (value || '').replace(/\s+/g, ' ').trim().toLowerCase();
		}

		function confirmUserDeletion(userId, username) {
			Swal.fire({
				title: 'Are you sure?',
				text: `Are you sure you want to delete user '${username}'?`,
				icon: 'warning',
				showCancelButton: true,
				confirmButtonColor: '#d33',
				cancelButtonColor: '#6c757d',
				confirmButtonText: 'Yes, delete!',
				cancelButtonText: 'No, cancel!'
			}).then(function(result) {
				if (result.isConfirmed) {
					deleteUser(userId);
				}
			});
		}

		function deleteUser(userId) {
			axios.delete('/inventory-ui/api/user/' + userId)
				.then(function(response) {
					Swal.fire('Deleted!', 'User deleted successfully.', 'success').then(function() {
						location.reload();
					});
				})
				.catch(function(error) {
					var msg = error && error.response && error.response.data ? error.response.data : 'Error deleting user.';
					InventoryUI.error(msg);
				});
		}

		function initializeUserFilters() {
			var roleSet = new Set();
			var permissionSet = new Set();
			document.querySelectorAll('tr.user-row').forEach(function(row) {
				row.querySelectorAll('.roles-cell .chip').forEach(function(chip) {
					var role = normalizeText(chip.textContent);
					if (role) roleSet.add(role);
				});
				row.querySelectorAll('.permissions-cell .chip-muted').forEach(function(chip) {
					var permission = normalizeText(chip.textContent);
					if (permission && permission !== 'no permissions') permissionSet.add(permission);
				});
			});

			populateSelectOptions('userRoleFilter', roleSet, 'All Roles');
			populateSelectOptions('userPermissionFilter', permissionSet, 'All Permissions');
		}

		function populateSelectOptions(selectId, values, defaultLabel) {
			var select = document.getElementById(selectId);
			var existing = new Set();
			Array.from(select.options).forEach(function(opt) {
				existing.add(opt.value);
			});

			Array.from(values).sort().forEach(function(value) {
				if (existing.has(value)) return;
				var option = document.createElement('option');
				option.value = value;
				option.textContent = value.toUpperCase();
				select.appendChild(option);
			});
		}

		function applyUserFilters() {
			var searchTerm = normalizeText(document.getElementById('userSearch').value);
			var selectedRole = normalizeText(document.getElementById('userRoleFilter').value);
			var selectedPermission = normalizeText(document.getElementById('userPermissionFilter').value);
			var visibleCount = 0;

			document.querySelectorAll('tr.user-row').forEach(function(row) {
				var userName = normalizeText(row.getAttribute('data-username'));
				var fullName = normalizeText((row.querySelector('.name-cell') || {}).textContent);
				var email = normalizeText((row.cells[2] || {}).textContent);
				var roles = normalizeText((row.querySelector('.roles-cell') || {}).textContent);
				var permissions = normalizeText((row.querySelector('.permissions-cell') || {}).textContent);

				var matchesSearch = !searchTerm
					|| fullName.indexOf(searchTerm) !== -1
					|| email.indexOf(searchTerm) !== -1
					|| userName.indexOf(searchTerm) !== -1;
				var matchesRole = !selectedRole || roles.indexOf(selectedRole) !== -1;
				var matchesPermission = !selectedPermission || permissions.indexOf(selectedPermission) !== -1;

				var isVisible = matchesSearch && matchesRole && matchesPermission;
				row.style.display = isVisible ? '' : 'none';
				if (isVisible) visibleCount += 1;
			});

			var meta = document.getElementById('userResultsMeta');
			if (meta) {
				meta.innerHTML = '<i class="fa fa-filter"></i> ' + visibleCount + ' visible';
			}
		}

		document.addEventListener('DOMContentLoaded', function() {
			initializeUserFilters();
			applyUserFilters();
		});
