<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>RF Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="/inventory-ui/css/operations-ui.css" />
    <style>
      body {
        background-color: #f8f9fa;
        animation: colorchange 20s infinite;
        font-family: Arial, sans-serif;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
        color: #6c757d;
        font-size: 2em;
        text-shadow: 2px 2px #999999;
      }

      .list-group-item {
        font-size: 18px;
        border-radius: 20px;
        margin-bottom: 10px;
        transition: transform 0.2s;
      }

      .list-group-item:hover {
        transform: scale(1.05);
      }

      .btn-primary {
        width: 100%;
      }
/* .icon-container {
    display: flex;
    align-items: right;
   
} */
</style>
  </head>
  <body class="ops-page">
    <div class="topnav">
      <div class="links">
        <button
          style="background-color: #333; border: none"
          class="btn btn-secondary dropdown-toggle"
          type="button"
          id="dropdownMenuButton"
          data-toggle="dropdown"
          aria-haspopup="true"
          aria-expanded="true"
        >
          Menu
        </button>
        <div
          class="dropdown-menu dropdown-menu-left"
          aria-labelledby="dropdownMenuButton"
        >
          <div th:each="menu : ${nav_menus}">
            <div class="dropdown-item-container">
              <a
                class="dropdown-item dropdown-menu-main-content"
                th:if="${menu != null and menu.menu_type != 'CHILD_UI'}"
                th:href="@{${menu.menu_link}}"
                th:text="${menu.menuName}"
                th:classappend="${#strings.contains(menu.menu_link ?: '', currentMenu ?: '') ? 'active' : ''}"
              >
                <span
                  th:if="${menu != null and menu.menu_type == 'PARENT_UI'}"
                  class="arrow"
                >
                  &#9654;
                </span>
              </a>

              <!-- Submenu -->
              <div
                class="submenu"
                th:if="${menu != null and menu.menu_type != null and menu.menu_type == 'PARENT_UI'}"
              >
                <a
                  class="submenu-item"
                  th:each="submenu : ${menu.children}"
                  th:href="@{${submenu.menu_link}}"
                  th:text="${submenu.menuName}"
                ></a>
              </div>

            </div>
          </div>
        </div>
      </div>
      <div class="title">Warehouse Management System</div>
      <span class="icon-name" th:text="${user_name}"></span>
      &nbsp;&nbsp;&nbsp;&nbsp;

      <div class="dropdown">
        <button
          style="background-color: #333; border: none"
          class="btn btn-secondary dropdown-toggle"
          type="button"
          id="dropdownMenuButton"
          data-toggle="dropdown"
          aria-haspopup="true"
          aria-expanded="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="white"
            class="bi bi-person-circle"
            viewBox="0 0 16 16"
          >
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
            <path
              fill-rule="evenodd"
              d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
            />
          </svg>
        </button>
        <div
          class="dropdown-menu dropdown-menu-left"
          aria-labelledby="dropdownMenuButton"
        >
          <!-- <a class="dropdown-item"  href="#">Account</a> -->
          <a
            class="dropdown-item"
            th:href="@{${settings_url.menu_link}}"
            th:text="${settings_url.menuName}"
          ></a>
          <a
            class="dropdown-item"
            th:href="@{${logout_url.menu_link}}"
            th:text="${logout_url.menuName}"
            th:onclick="javascript:ajaxLogout('{{decodedToken}}')"
          ></a>
        </div>
      </div>
      &nbsp;&nbsp;&nbsp;&nbsp;
    </div>
    <div class="container ops-shell">
      <h1 class="header">RF Menu</h1>

      <ul class="list-group" th:each="menu : ${menus}">
        <li class="list-group-item">
          <a
            class="btn btn-primary"
            th:href="@{${menu.menu_link}}"
            th:text="${menu.menuName}"
          ></a>
        </li>
      </ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script type="text/javascript"></script>
  </body>
</html>
