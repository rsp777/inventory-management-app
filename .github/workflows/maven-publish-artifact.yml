name: Build and Deploy Artifact to Maven Registry
on:
  workflow_dispatch:

jobs:
  connect-to-tailscale-network:
    runs-on: ubuntu-latest
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:sop

  build:
    runs-on: ubuntu-latest
    needs: connect-to-tailscale-network
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Write Maven settings.xml
        run: |
          mkdir -p $HOME/.m2
          printf "%s" "${{ secrets.MAVEN_SETTINGS }}" > $HOME/.m2/settings.xml

      - name: Maven Build
        run: mvn clean package -s $HOME/.m2/settings.xml -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Write Maven settings.xml
        run: |
          mkdir -p $HOME/.m2
          printf "%s" "${{ secrets.MAVEN_SETTINGS }}" > $HOME/.m2/settings.xml

      - name: Run tests
        run: mvn test -s $HOME/.m2/settings.xml

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Write Maven settings.xml
        run: |
          mkdir -p $HOME/.m2
          printf "%s" "${{ secrets.MAVEN_SETTINGS }}" > $HOME/.m2/settings.xml

      - name: Deploy to GitHub Packages
        run: mvn deploy -s $HOME/.m2/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
